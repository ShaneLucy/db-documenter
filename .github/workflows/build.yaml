name: Build, Test, and SonarCloud Scan

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded runs on branches/PRs, but let every main commit finish its analysis.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # Job-level so the Sonar step's `if:` can see it (a step's own env is not
    # visible to its `if:`). Empty on fork PRs, which never receive secrets.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build, Test & Verify
        run: ./mvnw -B clean verify

      # Skipped when SONAR_TOKEN is unavailable (fork PRs). Reuses the compiled
      # classes and JaCoCo reports from the previous step (no clean). Host, organization
      # and project key live in the parent pom. Fails the job
      # if the SonarCloud quality gate fails.
      - name: SonarCloud Analysis
        if: env.SONAR_TOKEN != ''
        run: |
          ./mvnw -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
          -Dsonar.qualitygate.wait=true \
          -Dsonar.qualitygate.timeout=300
