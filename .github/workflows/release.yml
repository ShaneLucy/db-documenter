# Release workflow, triggered by pushing a vX.Y.Z tag.
#
#   build --> publish-docker --> create-release
#     \------------------------------^ (version output)
#
# The pom <version> is the single source of truth; the tag must match it.
# Publishing targets: GHCR Docker image + GitHub Release with the fat CLI jar.
name: Release

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Deny everything by default; each job requests only what it needs.
permissions: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/db-documenter

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Verify the tagged commit end to end and build the fat JAR once.
  # ---------------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      # Fail fast (before the long verify) if the tag and the pom disagree.
      - name: Verify tag matches pom version
        id: version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          POM_VERSION="$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)"
          if [[ "${TAG_VERSION}" != "${POM_VERSION}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} (version '${TAG_VERSION}') does not match pom version '${POM_VERSION}'"
            exit 1
          fi
          echo "Tag and pom agree on version ${POM_VERSION}"
          echo "version=${POM_VERSION}" >> "$GITHUB_OUTPUT"

      # Full gate: unit tests, Testcontainers ITs (ubuntu runners ship Docker),
      # and all static analysis. Never trust that CI passed for the tagged commit.
      - name: Build and verify
        run: mvn -B clean verify

      - name: Smoke test fat JAR
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          shopt -s nullglob
          jars=(target/*-jar-with-dependencies.jar)
          if (( ${#jars[@]} != 1 )); then
            echo "::error::Expected exactly one fat JAR, found ${#jars[@]}: ${jars[*]}"
            exit 1
          fi
          JAR="${jars[0]}"

          VERSION_OUTPUT="$(java -jar "${JAR}" --version)"
          echo "--version output: ${VERSION_OUTPUT}"
          if ! grep -qwF -- "${VERSION}" <<< "${VERSION_OUTPUT}"; then
            echo "::error::'--version' output does not contain pom version ${VERSION}"
            exit 1
          fi

          java -jar "${JAR}" --help > /dev/null

      - name: Upload fat JAR
        uses: actions/upload-artifact@v4
        with:
          name: fat-jar
          path: target/*-jar-with-dependencies.jar
          retention-days: 1
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Job 2: Build and push the Docker image to GHCR from the verified fat JAR.
  # ---------------------------------------------------------------------------
  publish-docker:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download fat JAR
        uses: actions/download-artifact@v4
        with:
          name: fat-jar
          path: target

      - name: Verify fat JAR exists
        run: |
          ls -lh target/
          compgen -G 'target/*-jar-with-dependencies.jar' > /dev/null \
            || { echo "::error::Fat JAR not found"; exit 1; }

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # latest=auto: 'latest' is applied only to non-prerelease semver tags,
      # so pushing e.g. v1.0.0-rc.1 does not move 'latest'.
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Job 3: Create a GitHub Release with the fat JAR attached.
  # ---------------------------------------------------------------------------
  create-release:
    needs: [build, publish-docker]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download fat JAR
        uses: actions/download-artifact@v4
        with:
          name: fat-jar
          path: artifacts

      - name: Prepare release asset
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          mv artifacts/*-jar-with-dependencies.jar "artifacts/db-documenter-${VERSION}-cli.jar"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: artifacts/db-documenter-${{ needs.build.outputs.version }}-cli.jar
          fail_on_unmatched_files: true
